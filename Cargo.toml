[package]
name = "once-upon-agentic-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "A hands-on Rust workshop that teaches the Strands Agents SDK by building a Game Master for a Table-Top Role-Playing Game (TTRPG)."

# The Rust Strands SDK is not yet published to crates.io (the tools crate is not
# published at all), so the workshop depends on a local checkout via path. See
# README.md -> "Where the SDK comes from" for how to point these elsewhere.
[dependencies]
strands-agents = { path = "../../aws/strands-agents-rust/strands-agents", features = ["mcp"] }
strands-agents-tools = { path = "../../aws/strands-agents-rust/strands-agents-tools", features = [
    "http-fetch",
    "shell",
    "file-ops",
] }
async-trait = "0.1.92"
axum = "0.8.9"
rand = "0.10.3"
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "ch1-summoning"
path = "1_strands_basics/main.rs"

[[bin]]
name = "ch2-vended-tools"
path = "2_vended_tools/main.rs"

[[bin]]
name = "ch2-bonus-quest"
path = "2_vended_tools/bonus_quest.rs"

[[bin]]
name = "ch3-custom-tools"
path = "3_custom_tools/main.rs"

[[bin]]
name = "ch4-dice-mcp-server"
path = "4_mcp_integration/dice_roll_mcp_server.rs"

[[bin]]
name = "ch4-gamemaster-mcp-client"
path = "4_mcp_integration/gamemaster_mcp_client.rs"
